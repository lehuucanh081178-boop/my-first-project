<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán Thành Công - TarotLove</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--dark); }
    .success-box {
      background:var(--card-bg); border:1px solid rgba(74,222,128,0.3);
      border-radius:20px; padding:48px 40px; text-align:center;
      max-width:480px; width:90%;
      box-shadow:0 0 40px rgba(74,222,128,0.15);
    }
    .success-icon { font-size:4rem; margin-bottom:16px; animation:bounce .6s ease; }
    @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    .success-title { font-family:'Cinzel',serif; font-size:1.6rem; color:#4ade80; margin-bottom:12px; }
    .success-desc { color:var(--text-muted); margin-bottom:28px; line-height:1.6; }
    .success-info { background:var(--dark3); border-radius:12px; padding:16px 20px; margin-bottom:24px; text-align:left; }
    .success-info p { color:var(--text); font-size:.9rem; margin-bottom:6px; }
    .btn-home {
      display:inline-block; background:linear-gradient(135deg,var(--purple),var(--gold));
      color:white; padding:12px 32px; border-radius:50px;
      text-decoration:none; font-weight:700; font-size:1rem;
      transition:all .2s;
    }
    .btn-home:hover { opacity:.9; transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="success-box">
    <div class="success-icon">✅</div>
    <h1 class="success-title">Thanh Toán Thành Công!</h1>
    <p class="success-desc">Cảm ơn bạn đã tin tưởng TarotLove. Chúng tôi sẽ xác nhận và liên hệ bạn trong vòng <strong>30 phút</strong>.</p>
    <div class="success-info" id="bookingInfo">
      <p>🔮 Đơn đặt lịch của bạn đã được ghi nhận</p>
      <p>📧 Email xác nhận đã được gửi</p>
      <p>⏰ Vui lòng chờ reader liên hệ</p>
    </div>
    <a href="dashboard.html#bookings" class="btn-home">Xem Lịch Đặt Của Tôi →</a>
  </div>
  <script>
    // Lấy thông tin từ URL params nếu có
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const resultCode = params.get('resultCode');
    if (resultCode && resultCode !== '0') {
      document.querySelector('.success-icon').textContent = '❌';
      document.querySelector('.success-title').textContent = 'Thanh Toán Thất Bại';
      document.querySelector('.success-title').style.color = '#f87171';
      document.querySelector('.success-desc').textContent = 'Giao dịch không thành công. Vui lòng thử lại hoặc chọn phương thức thanh toán khác.';
    }
  </script>
</body>
</html>
